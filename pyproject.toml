[project]
name = "quoteflow"
version = "0.1.0"
description = "Turn quote-request emails into reviewed, deterministic quote PDFs (portfolio project with a fictional customer and synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.6,<3",
    "pydantic>=2.14,<3",
    "reportlab>=5.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "click>=8.1",  # already installed by typer; declared because review uses click.edit
    "mcp>=2.3,<3",
]

[project.scripts]
quoteflow = "quoteflow.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quoteflow"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Japanese business text legitimately uses full-width characters (：、（）×), which RUF001-003 flag.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The data generator holds wide, table-like literals (price list, email templates).
"scripts/make_synthetic_data.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["quoteflow"]

# reportlab and openpyxl ship no type information.
[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["quoteflow"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
